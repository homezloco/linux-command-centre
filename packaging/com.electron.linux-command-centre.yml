app-id: com.electron.linux-command-centre
runtime: org.freedesktop.Platform
runtime-version: "24.08"
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: "24.08"
command: linux-command-centre
separate-locales: false

finish-args:
  - --share=ipc
  - --socket=x11
  - --socket=wayland
  - --socket=pulseaudio
  - --share=network
  - --device=dri
  - --filesystem=host
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.freedesktop.DBus
  - --talk-name=org.freedesktop.PolicyKit1
  - --system-talk-name=org.freedesktop.NetworkManager
  - --system-talk-name=org.freedesktop.systemd1
  - --system-talk-name=org.freedesktop.UDisks2

modules:
  - name: linux-command-centre
    buildsystem: simple
    build-options:
      build-args:
        - --share=network
    sources:
      - type: file
        url: https://github.com/yourusername/linux-command-centre/releases/download/v0.1.0/linux-command-centre-0.1.0-linux-amd64.tar.gz
        sha256: PLACEHOLDER_REPLACE_WITH_ACTUAL_SHA256
    build-commands:
      - install -Dm755 -t /app/bin/linux-command-centre linux-command-centre
      - install -Dm644 linux-command-centre.desktop /app/share/applications/com.electron.linux-command-centre.desktop
      - install -Dm644 linux-command-centre.png /app/share/icons/hicolor/512x512/apps/com.electron.linux-command-centre.png
      - install -Dm644 com.electron.linux-command-centre.metainfo.xml /app/share/metainfo/com.electron.linux-command-centre.metainfo.xml
    post-install:
      - install -Dm755 -t /app/bin linux-command-centre
