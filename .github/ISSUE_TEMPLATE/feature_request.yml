name: Feature request
description: Suggest a module, action, or improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The underlying need, not just the feature — helps find the simplest fit
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed feature
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: How are you working around this today?
      description: e.g. a terminal command, a different app
    validations:
      required: false
