name: Bug report
description: Something in the app doesn't work as expected
labels: [bug]
body:
  - type: input
    id: distro
    attributes:
      label: Distro and version
      placeholder: "Ubuntu 24.04"
    validations:
      required: true
  - type: input
    id: desktop
    attributes:
      label: Desktop environment
      description: Output of `echo $XDG_CURRENT_DESKTOP`
      placeholder: "ubuntu:GNOME"
    validations:
      required: true
  - type: input
    id: install-method
    attributes:
      label: How did you install the app?
      placeholder: ".deb from GitHub Releases / AUR / built from source / etc."
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: Which module/action, and what went wrong
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected instead
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: "`journalctl --user -b | grep linux-command-centre`, or anything printed in the app's console"
      render: shell
    validations:
      required: false
