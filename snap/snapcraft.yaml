name: linux-command-centre
base: core24
version: '0.1.0'
summary: Centralised Linux system management dashboard
description: |
  A desktop system management dashboard for Ubuntu/Linux, built with Electron.
  Manage system info, network (VPN, Wi-Fi, Bluetooth), hardware, storage,
  services, logs, and more from one place.

title: Linux Command Centre
license: MIT
contact: https://github.com/homezloco/linux-command-centre/issues
issues: https://github.com/homezloco/linux-command-centre/issues
source-code: https://github.com/homezloco/linux-command-centre
website: https://github.com/homezloco/linux-command-centre

grade: stable
confinement: classic

platforms:
  amd64:
  arm64:

apps:
  linux-command-centre:
    command: linux-command-centre

parts:
  linux-command-centre:
    plugin: dump
    source: .
    source-type: local
    build-snaps:
      - node/20/stable
    build-packages:
      - python3
      - make
      - gcc
      - g++
      - libnss3-dev
      - libgdk-pixbuf2.0-dev
      - libgtk-3-dev
      - libxss-dev
      - libasound2-dev
    override-build: |
      set -e
      npm ci
      npm run build
      npx electron-builder --linux dir --publish never
      mkdir -p $CRAFT_PART_INSTALL/
      cp -r release/linux*unpacked/* $CRAFT_PART_INSTALL/
      mkdir -p $CRAFT_PART_INSTALL/usr/share/polkit-1/actions
      cp helper/io.lcc.helper.policy $CRAFT_PART_INSTALL/usr/share/polkit-1/actions/io.lcc.helper.policy
